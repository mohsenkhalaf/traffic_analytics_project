name: 'traffic_analytics_dbt'
version: '1.0.0'
config-version: 2

profile: 'traffic_analytics_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  traffic_analytics_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

seeds:
  traffic_analytics_dbt:
    Cleaned_Data_Output:
      +delimiter: ';'
    traffic_message_locations_english_only:
      +delimiter: ';'
    Cleaned_Traffic_Announcements:
      +delimiter: ','